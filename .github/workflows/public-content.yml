name: Public content check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_public_content.py --ref HEAD
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s melt-worklog/scripts -p 'test_*.py'
      - run: python -m unittest discover -s jp-llm-lint/scripts -p 'test_*.py'
